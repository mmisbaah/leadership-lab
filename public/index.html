<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142440">
<title>Leadership Lab</title>
<meta name="description" content="An interactive one-day leadership training guide for working adults.">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand"><div class="mark">L</div><div><small>Leadership training</small><b>Leadership Lab</b></div></div>
    <nav id="navigation" aria-label="Course"></nav>
    <div class="sidefoot"><b>One day. Practical leadership.</b><br>Built for working adults. Your notes and progress are saved to your account.</div>
  </aside>
  <main>
    <div class="top">
      <div class="row"><button class="btn secondary mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><span>Leadership Lab</span></div>
      <small id="who">SELF · PEOPLE · PERFORMANCE</small>
    </div>
    <div class="main-inner" id="content" tabindex="-1"></div>
  </main>
</div>
<div id="presentation" class="presentation" role="dialog" aria-modal="true" aria-label="Presentation view">
  <div class="eyebrow" id="slideKicker"></div>
  <div class="slide-body"><h2 id="slideTitle"></h2><p id="slideText"></p></div>
  <div class="slide-foot"><span id="slideCount"></span>
    <div class="actions"><button class="btn secondary" id="prevSlide">Previous</button><button class="btn" id="nextSlide">Next</button><button class="btn secondary" id="closeSlide">Close</button></div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
