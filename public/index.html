<script>
// Apply the saved theme before first paint so the page doesn't flash the wrong one.
(function () {
  var t = null; try { t = localStorage.getItem('ll-theme'); } catch (e) {}
  var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.classList.toggle('neu', !dark);
})();
</script>
</head>

<aside class="rail" aria-label="Main navigation">
  <div class="brand"><b>Leadership<br>Lab</b><span>Leadership training</span></div>

  <div class="rail-foot" id="railFoot"></div>
</aside>
<header class="topbar">
  <div><b>Leadership Lab</b><small>Leadership training</small></div>
  <button class="theme-btn" data-theme-toggle type="button">Dark theme</button>
</header>
<main><div class="wrap" id="view" tabindex="-1"></div></main>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
